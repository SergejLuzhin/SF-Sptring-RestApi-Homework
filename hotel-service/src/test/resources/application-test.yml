spring:
  datasource:
    url: jdbc:h2:mem:hoteltestdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
  cloud:
    discovery:
      enabled: false

eureka:
  client:
    enabled: false

security:
  jwt:
    secret: booking-service-test-jwt-secret-with-at-least-32-bytes
    issuer: booking-service-test
