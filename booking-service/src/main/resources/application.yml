server:
  port: 8082

spring:
  application:
    name: booking-service
  datasource:
    url: jdbc:h2:mem:bookingdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
  h2:
    console:
      enabled: false

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [correlationId=%X{correlationId:-},requestId=%X{requestId:-},bookingId=%X{bookingId:-}] %logger{36} - %msg%n"

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info

security:
  jwt:
    secret: ${JWT_SECRET:local-booking-service-jwt-secret-change-me-32-bytes}
    issuer: ${JWT_ISSUER:booking-service}

admin:
  username: ${ADMIN_USERNAME:}
  password: ${ADMIN_PASSWORD:}

hotel:
  client:
    base-url: http://hotel-service
    connect-timeout: 2s
    read-timeout: 3s
    confirm:
      max-attempts: 3
      initial-backoff: 100ms
      max-backoff: 500ms
    release:
      max-attempts: 4
      initial-backoff: 100ms
      max-backoff: 800ms
