spring:
  datasource:
    url: jdbc:h2:mem:bookingtestdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
  cloud:
    discovery:
      enabled: false

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [correlationId=%X{correlationId:-},requestId=%X{requestId:-},bookingId=%X{bookingId:-}] %logger{36} - %msg%n"

eureka:
  client:
    enabled: false

security:
  jwt:
    secret: booking-service-test-jwt-secret-with-at-least-32-bytes
    issuer: booking-service-test

admin:
  username:
  password:
